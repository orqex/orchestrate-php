name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  # Opt JS actions into Node 24 ahead of the June 2026 GitHub runner default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-please is run via npx rather than the marketplace action,
      # because third-party actions are restricted by the org allowlist.
      # Only GitHub-owned actions (checkout, setup-node) are used here.
      #
      # The release branch must stay a single path segment. The enterprise
      # `branch-and-commit-conventions` ruleset excludes
      # `refs/heads/release-please--**`, and that glob does not span a `/`, so a
      # component containing a slash produces a two-segment ref that falls back
      # under `branch_name_pattern` and is rejected with a 422. Hence the
      # slash-free `component` in release-please-config.json.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Open or update the release PR
        run: >-
          npx --yes release-please@16 release-pr
          --repo-url="${{ github.repository }}"
          --target-branch=main
          --config-file=release-please-config.json
          --manifest-file=.release-please-manifest.json
          --token="${{ secrets.GITHUB_TOKEN }}"

      - name: Tag and publish the GitHub release when a release PR is merged
        run: >-
          npx --yes release-please@16 github-release
          --repo-url="${{ github.repository }}"
          --target-branch=main
          --config-file=release-please-config.json
          --manifest-file=.release-please-manifest.json
          --token="${{ secrets.GITHUB_TOKEN }}"
